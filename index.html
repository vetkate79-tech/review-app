<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b28"><title>口コミ工房</title><style>body{margin:0;background:#f5f7f4;color:#172b28;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:660px;margin:auto;padding:28px 18px}h1{font-size:30px;margin-bottom:4px}p{color:#65736e}section{background:white;border:1px solid #e1e7e2;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 3px 14px #122d2110}label{display:block;font-weight:700;margin:16px 0 7px}input,select,textarea{box-sizing:border-box;width:100%;font:inherit;border:1px solid #ccd7d0;border-radius:10px;padding:12px;background:white}textarea{min-height:105px}button{border:0;border-radius:11px;background:#176a51;color:white;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e5ede8;color:#18543e}.muted{font-size:12px;color:#66756f}#result{white-space:pre-wrap;line-height:1.9} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style><main><h1>口コミ工房 ✨</h1><p>あなたの体験を、伝わるGoogleマップ口コミに。</p><section><label>GoogleマップURL（任意）</label><input id="url" placeholder="https://maps.app.goo.gl/..."><small class="muted">URLだけで操作できます。ただし無料版では短縮URLの店舗情報を自動取得できず、口コミ本文は確認用の下書きになります。</small><div class="grid"><div><label>星評価</label><select id="rating"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div><div><label>文体</label><select id="tone"><option value="natural">自然で丁寧</option><option value="passion">熱量高め</option><option value="critical">厳しめ</option><option value="detail">詳しく分析</option></select></div></div><label>目標文字数</label><select id="length"><option>200</option><option selected>300</option><option>500</option></select><button onclick="generate()">口コミを作成</button><p class="muted">無料の定型文補助ツールです。AI APIは使わず、店舗情報の自動取得やAI生成は未対応です。内容を確認してから投稿してください。</p></section><section><h2>生成した口コミ</h2><div id="result">ここに口コミが表示されます。</div><button onclick="copy()">コピーする</button><button class="secondary" onclick="generate()">再生成</button></section><section><h2>履歴</h2><div id="history"></div><button class="secondary" onclick="localStorage.removeItem('reviewHistory');renderHistory()">履歴を削除</button></section></main><script>const $=id=>document.getElementById(id);let last='';function generate(){let url=$('url').value.trim(),rating=+$('rating').value,tone=$('tone').value,target=+$('length').value;if(!/^https:\/\/(maps\.app\.goo\.gl|www\.google\.[^/]+|google\.[^/]+)\//i.test(url)){alert('GoogleマップのURLを入力してください');return}let label='この場所';try{let u=new URL(url);let match=u.pathname.match(/\/maps\/place\/([^/]+)/);if(match)label=decodeURIComponent(match[1].replace(/\+/g,' '))}catch(e){}let out=label+'についての口コミ下書きです。\n\n'+(rating>=4?'訪問時に良かった点や印象に残ったことを、実際の体験に沿って記載してください。':'訪問時に気になった点や改善を期待する点を、実際の体験に沿って記載してください。')+'\n\nGoogleマップのリンクだけでは、この無料版は店舗情報や訪問体験を取得できません。事実に基づく口コミを作るには内容の確認が必要です。';last=out;$('result').textContent=out;let h=JSON.parse(localStorage.getItem('reviewHistory')||'[]');h.unshift({place:label,text:out,date:new Date().toLocaleString('ja-JP')});localStorage.setItem('reviewHistory',JSON.stringify(h.slice(0,30)));renderHistory()} async function copy(){if(!last)return;try{await navigator.clipboard.writeText(last);alert('コピーしました')}catch(e){alert('コピーできませんでした。文章を長押ししてコピーしてください')}}function renderHistory(){let h=JSON.parse(localStorage.getItem('reviewHistory')||'[]');$('history').replaceChildren();h.forEach(v=>{let d=document.createElement('div');d.style='border-bottom:1px solid #eee;padding:12px 0';let b=document.createElement('button');b.className='secondary';b.textContent=v.place+'（'+v.date+'）';b.onclick=()=>{last=v.text;$('result').textContent=v.text;window.scrollTo({top:0,behavior:'smooth'})};d.append(b);$('history').append(d)});if(!h.length)$('history').textContent='まだ履歴はありません'}renderHistory();</script></html>
