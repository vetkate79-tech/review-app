<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b28"><title>口コミ工房</title><style>body{margin:0;background:#f5f7f4;color:#172b28;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:660px;margin:auto;padding:28px 18px}h1{font-size:30px;margin-bottom:4px}p{color:#65736e}section{background:white;border:1px solid #e1e7e2;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 3px 14px #122d2110}label{display:block;font-weight:700;margin:16px 0 7px}input,select,textarea{box-sizing:border-box;width:100%;font:inherit;border:1px solid #ccd7d0;border-radius:10px;padding:12px;background:white}textarea{min-height:105px}button{border:0;border-radius:11px;background:#176a51;color:white;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e5ede8;color:#18543e}.muted{font-size:12px;color:#66756f}#result{white-space:pre-wrap;line-height:1.9} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style><main><h1>口コミ工房 ✨</h1><p>あなたの体験を、伝わるGoogleマップ口コミに。</p><section><label>GoogleマップURL</label><input id="url" placeholder="https://maps.app.goo.gl/..."><small class="muted">GoogleマップのURLから場所を読み取り、確認できた情報をもとに文章を作成します。短縮URLは取得できない場合があります。</small><div class="grid"><div><label>星評価</label><select id="rating"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div><div><label>文体</label><select id="tone"><option value="natural">自然で丁寧</option><option value="passion">熱量高め</option><option value="critical">厳しめ</option><option value="detail">詳しく分析</option></select></div></div><label>目標文字数</label><select id="length"><option>200</option><option selected>300</option><option>500</option></select><button onclick="generate()">口コミを作成</button><p class="muted">無料版です。場所が特定できない場合は文章を作りません。実際に訪問していない体験は生成せず、公開情報から確認できる範囲だけを文章化します。</p></section><section><h2>生成した口コミ</h2><div id="result">ここに口コミが表示されます。</div><button onclick="copy()">コピーする</button><button class="secondary" onclick="generate()">再生成</button></section><section><h2>履歴</h2><div id="history"></div><button class="secondary" onclick="localStorage.removeItem('reviewHistory');renderHistory()">履歴を削除</button></section></main><script>const $=id=>document.getElementById(id);let last='';async function generate(){let url=$('url').value.trim(),rating=+$('rating').value,tone=$('tone').value,target=+$('length').value;let btn=document.querySelector('button[onclick="generate()"]');if(!/^https:\/\/(maps\.app\.goo\.gl|(?:www\.)?google\.[^/]+|goo\.gl)\//i.test(url)){alert('GoogleマップのURLを入力してください');return}btn.disabled=true;btn.textContent='場所を確認中…';$('result').textContent='Googleマップの場所を確認しています…';try{let resolved=url;let u=new URL(url);if(u.hostname==='maps.app.goo.gl'||u.hostname==='goo.gl'){let success=false;for(let endpoint of ['https://corsproxy.io/?url='+encodeURIComponent(url),'https://api.allorigins.win/raw?url='+encodeURIComponent(url)]){try{let res=await fetch(endpoint,{signal:AbortSignal.timeout(7000)});if(res.ok){let html=await res.text();let m=html.match(/<link[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)/i)||html.match(/<meta[^>]*property=["']og:url["'][^>]*content=["']([^"']+)/i);if(m&&m[1].includes('google')){resolved=m[1].replace(/&amp;/g,'&');success=true;break}if(res.url.includes('google.com/maps')){resolved=res.url;success=true;break}}}catch(e){}}if(!success)throw Error('この短縮URLはブラウザから展開できません。Googleマップで「共有」から通常の長いURLをコピーして試してください。')}let parsed=new URL(resolved),raw=parsed.pathname.match(/\/maps\/place\/([^/]+)/),name=raw?decodeURIComponent(raw[1].replace(/\+/g,' ')):null;if(!name){let q=parsed.searchParams.get('q')||parsed.searchParams.get('query');if(q&&!/^[-\d.,\s]+$/.test(q))name=q}if(!name||name.length<2)throw Error('URLから店舗名を特定できませんでした。店舗名が含まれるGoogleマップの長いURLを使ってください。');let textParts=[];if(rating>=4){textParts.push(name+'は、訪問先として気になる場所です。');textParts.push('Googleマップで場所を確認できるため、アクセスや周辺の位置関係を調べる際にも便利です。')}else{textParts.push(name+'について、利用前に確認しておきたい点があります。');textParts.push('営業時間やサービス内容、アクセス方法などは事前に公式情報と照らし合わせて確認するのがよさそうです。')}if(tone==='detail')textParts.push('所在地や営業状況などの最新情報は、訪問前に改めて確認することをおすすめします。');else if(tone==='critical')textParts.push('公開情報だけでは接客や品質までは判断できないため、実際の利用体験と区別して評価することが大切です。');else if(tone==='passion')textParts.push('訪問前に情報を調べるきっかけになる、気になるスポットです。');let out=textParts.join('\n\n');if(out.length<target)out+='\n\n※現時点では公開URLだけから実際の料理・接客・設備を確認できないため、文字数を埋める目的の架空の体験談は追加していません。';last=out;$('result').textContent=out;let h=JSON.parse(localStorage.getItem('reviewHistory')||'[]');h.unshift({place:name,text:out,date:new Date().toLocaleString('ja-JP')});localStorage.setItem('reviewHistory',JSON.stringify(h.slice(0,30)));renderHistory()}catch(e){last='';$('result').textContent='場所を特定できませんでした。\n\n'+e.message}finally{btn.disabled=false;btn.textContent='口コミを作成'}} async function copy(){if(!last)return;try{await navigator.clipboard.writeText(last);alert('コピーしました')}catch(e){alert('コピーできませんでした。文章を長押ししてコピーしてください')}}function renderHistory(){let h=JSON.parse(localStorage.getItem('reviewHistory')||'[]');$('history').replaceChildren();h.forEach(v=>{let d=document.createElement('div');d.style='border-bottom:1px solid #eee;padding:12px 0';let b=document.createElement('button');b.className='secondary';b.textContent=v.place+'（'+v.date+'）';b.onclick=()=>{last=v.text;$('result').textContent=v.text;window.scrollTo({top:0,behavior:'smooth'})};d.append(b);$('history').append(d)});if(!h.length)$('history').textContent='まだ履歴はありません'}renderHistory();</script></html>
